name: Public site checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check atlas problem, fixed-case and source identity bindings
        env:
          ATLAS_IDENTITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          baseline_args=()
          if [[ -n "$ATLAS_IDENTITY_BASE_SHA" && ! "$ATLAS_IDENTITY_BASE_SHA" =~ ^0{40}$ ]]; then
            [[ "$ATLAS_IDENTITY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            if ! git cat-file -e "$ATLAS_IDENTITY_BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$ATLAS_IDENTITY_BASE_SHA"
            fi
            baseline_args+=(--baseline-ref "$ATLAS_IDENTITY_BASE_SHA")
          fi
          python3 scripts/check-atlas-identities.py "${baseline_args[@]}"
      - name: Regenerate every index and reject stale generated files
        run: python3 scripts/prepare-indexes.py --check
      - name: Check public links, data and generated indexes
        run: python3 scripts/check-site.py
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check browser-local research and search logic
        run: node --test scripts/*.test.mjs
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked browser test tooling
        run: npm ci --ignore-scripts
      - name: Install the pinned Chromium browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Check Japanese and English routes at narrow and standard widths
        run: npm run test:browser
      - name: Retain browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-browser-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
