name: Foundations English public Web and PDF verification
on:
  workflow_run:
    workflows: ['Public site checks']
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  english-public:
    if: >-
      github.repository == 'hrkoyama/hrkoyama.github.io' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
      EN_BOOK_RECEIPT_SHA256: 'bc5c2db5e6e8f75d3380ca208e537052d371fa3f59ccb7dc1e0566e34dc694f7'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /catalog/atlas-foundations-course*.json
            /scripts/foundations_en_contract.py
            /scripts/foundations_pdf_text.py
            /scripts/verify-foundations-course-en-public.py
            /scripts/foundations_books.py
            /scripts/verify-foundations-books-public.py
            /catalog/atlas-foundations-books.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir pypdf==6.21.4
      - name: Check public English pages, every shared figure, and all PDF text
        env:
          REPORT_DIR: ${{ runner.temp }}/foundations-en-public
        run: python scripts/verify-foundations-course-en-public.py
      - name: Retain public-verification receipt and downloaded PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundations-en-public-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/foundations-en-public/
          if-no-files-found: error
          retention-days: 90
      - name: Check separately verified Japanese and English book delivery
        env:
          REPORT_DIR: ${{ runner.temp }}/foundations-books-public
        run: |
          BOOKS_REGISTRY_SHA=$(sha256sum catalog/atlas-foundations-books.json | cut -d ' ' -f 1)
          python scripts/verify-foundations-books-public.py --registry-sha256 "$BOOKS_REGISTRY_SHA" --target-sha "${{ github.sha }}" --output "$REPORT_DIR"
      - name: Retain separate book-delivery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundations-books-public-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/foundations-books-public/
          if-no-files-found: error
          retention-days: 90
